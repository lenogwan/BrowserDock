<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Save to BrowserDock</title><link rel="stylesheet" href="capture.css"></head>
<body><main>
  <header><span class="brand">BrowserDock</span><button type="button" class="secondary" id="settings">Connection settings</button></header>
  <h1>Save this tab</h1>
  <p class="hint">Save a public bookmark on this computer.</p>
  <p id="page-url" class="url"></p>
  <p id="target" class="hint"></p>
  <form id="capture-form">
    <label for="title">Title</label><input id="title" required maxlength="512" autocomplete="off" disabled>
    <label for="group">Group</label><select id="group" disabled><option value="">Ungrouped</option></select>
    <div class="actions"><button id="save" type="submit" disabled>Save to BrowserDock</button><button id="refresh" type="button" class="secondary">Refresh</button></div>
  </form>
  <p id="status" role="status" aria-live="polite">Connecting to BrowserDock…</p>
  <p class="hint">Private-window tabs are not captured. Create and manage groups in BrowserDock.</p>
</main><script src="capture-popup.js"></script></body>
</html>
